<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOYAGER-X // Exoplanet Hunter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN for Light Curve Plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-slate-950 text-slate-100 font-mono min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-wider text-blue-400">VOYAGER-X</span>
            <span
                class="text-xs uppercase bg-blue-950 text-blue-300 px-2 py-0.5 rounded border border-blue-800">Exoplanet
                Hunter</span>
        </div>
        <div class="flex items-center space-x-6 text-xs text-slate-400">
            <div>BRIDGE: <span id="bridge-status" class="text-emerald-400 font-bold">ONLINE</span></div>
            <div>UTC <span id="utc-clock">00:00:00</span></div>
        </div>
    </header>

    <!-- Main Dashboard Grid -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">

        <!-- Left Column: Controls & Telemetry Log -->
        <div class="space-y-6 flex flex-col">
            <!-- Target Acquisition Card -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-5 shadow-xl">
                <h2
                    class="text-sm uppercase tracking-wider text-blue-400 font-bold mb-4 border-b border-slate-800 pb-2">
                    Target Acquisition</h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase text-slate-400 mb-1">Target Name / TIC ID</label>
                        <input id="target-input" type="text" value="25155310"
                            class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>
                    <button onclick="runScan()"
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded transition tracking-wider text-xs uppercase shadow-lg shadow-blue-900/30">
                        Initiate BLS Scan
                    </button>
                </div>
            </div>

            <!-- Telemetry Log Card -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-5 shadow-xl flex-1 flex flex-col">
                <h2 class="text-sm uppercase tracking-wider text-slate-400 font-bold mb-3">Telemetry Log</h2>
                <div id="telemetry-log"
                    class="bg-slate-950 border border-slate-900 rounded p-3 text-xs text-slate-300 font-mono flex-1 min-h-[160px] max-h-[220px] overflow-y-auto space-y-1">
                    <div>System armed. Awaiting target parameters...</div>
                </div>
            </div>
        </div>

        <!-- Right/Center Column: Visual Analysis & Metrics -->
        <div class="lg:col-span-2 space-y-6 flex flex-col">

            <!-- Metrics Summary Cards -->
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4">
                    <div class="text-xs text-slate-400 uppercase">Data Source</div>
                    <div id="metric-source" class="text-sm font-bold text-blue-400 mt-1">--</div>
                </div>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4">
                    <div class="text-xs text-slate-400 uppercase">Total Observations</div>
                    <div id="metric-obs" class="text-sm font-bold text-emerald-400 mt-1">--</div>
                </div>
                <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-4">
                    <div class="text-xs text-slate-400 uppercase">Scan Status</div>
                    <div id="metric-status" class="text-sm font-bold text-slate-300 mt-1">Standby</div>
                </div>
            </div>

            <!-- Visualization Canvas Card -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-lg p-5 shadow-xl flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                    <h2 class="text-sm uppercase tracking-wider text-blue-400 font-bold">Pipeline Output & Light Curve
                        Analysis</h2>
                    <span id="target-badge" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">Target:
                        None</span>
                </div>

                <!-- Chart Container -->
                <div class="relative flex-1 w-full min-h-[320px]">
                    <canvas id="lightCurveChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        // UTC Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('utc-clock').innerText = now.toUTCString().split(' ')[4];
        }, 1000);

        let myChart = null;

        function logMessage(msg) {
            const logBox = document.getElementById('telemetry-log');
            logBox.innerHTML += `<div>> ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function runScan() {
            const target = document.getElementById('target-input').value.trim();
            if (!target) {
                logMessage("ERROR: Target field cannot be empty.");
                return;
            }

            logMessage(`Transmitting request for target: ${target}...`);
            document.getElementById('metric-status').innerText = "Scanning...";

            try {
                const response = await fetch(`http://127.0.0.1:8000/api/lightcurve/${encodeURIComponent(target)}`);
                if (!response.ok) throw new Error(`Server returned status ${response.status}`);

                const data = await response.json();
                logMessage(`Success! Received telemetry for ${target}.`);

                // Update Summary Cards
                document.getElementById('metric-source').innerText = data.source || "Unknown";
                document.getElementById('metric-obs').innerText = data.total_observations || data.time?.length || 0;
                document.getElementById('metric-status').innerText = "SUCCESS";
                document.getElementById('target-badge').innerText = `Target: ${data.target}`;

                // Render Chart
                renderChart(data.time, data.flux);

            } catch (err) {
                logMessage(`CRITICAL ERROR: ${err.message}`);
                document.getElementById('metric-status').innerText = "FAILED";
            }
        }

        function renderChart(timeData, fluxData) {
            const ctx = document.getElementById('lightCurveChart').getContext('2d');

            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: timeData,
                    datasets: [{
                        label: 'Normalized Flux',
                        data: fluxData,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        pointRadius: 3,
                        pointBackgroundColor: '#3b82f6',
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#94a3b8', font: { family: 'monospace' } } }
                    },
                    scales: {
                        x: {
                            grid: { color: '#1e293b' },
                            ticks: { color: '#64748b', font: { family: 'monospace' } },
                            title: { display: true, text: 'Time (BJD)', color: '#64748b' }
                        },
                        y: {
                            grid: { color: '#1e293b' },
                            ticks: { color: '#64748b', font: { family: 'monospace' } },
                            title: { display: true, text: 'Relative Flux', color: '#64748b' }
                        }
                    }
                }
            });
        }
    </script>
</body>

</html>
