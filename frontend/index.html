<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOYAGER-X // Exoplanet Hunter</title>
    <!-- Tailwind CSS for rapid, gorgeous styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        spaceBlack: '#0b0f19',
                        controlPanel: '#111827',
                        nasaBlue: '#0b3d91',
                        nasaRed: '#fc3d21',
                        telemetryGreen: '#10b981',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-spaceBlack text-gray-100 min-h-screen font-mono flex flex-col">

    <!-- Header / Mission Banner -->
    <header class="bg-controlPanel border-b border-gray-800 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 bg-nasaRed rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wider text-white">VOYAGER-X <span
                    class="text-nasaBlue text-sm bg-blue-900/40 px-2 py-0.5 rounded border border-blue-700/50">EXOPLANET
                    HUNTER</span></h1>
        </div>
        <div class="text-xs text-gray-400 flex items-center space-x-4">
            <span>BRIDGE: <strong class="text-telemetryGreen">ONLINE</strong></span>
            <span id="utc-clock">UTC 00:00:00</span>
        </div>
    </header>

    <!-- Main Control Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Left Panel: Target Input & Controls -->
        <section class="bg-controlPanel border border-gray-800 rounded-lg p-6 shadow-xl flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold mb-4 text-blue-400 border-b border-gray-800 pb-2">Target Acquisition
                </h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase text-gray-400 mb-1">Target Name / TIC ID</label>
                        <input id="targetInput" type="text" placeholder="e.g., TIC 44105959"
                            class="w-full bg-spaceBlack border border-gray-700 rounded px-3 py-2 text-white focus:outline-none focus:border-nasaBlue">
                    </div>

                    <button onclick="runAnalysis()"
                        class="w-full bg-nasaBlue hover:bg-blue-800 text-white font-bold py-2.5 px-4 rounded transition-all duration-200 shadow-md border border-blue-600 tracking-wide flex justify-center items-center space-x-2">
                        <span>INITIATE BLS SCAN</span>
                    </button>
                </div>
            </div>

            <!-- Status Box -->
            <div class="mt-6 bg-spaceBlack border border-gray-800 rounded p-4 text-xs">
                <p class="text-gray-500 uppercase tracking-wider mb-1">Telemetry Log</p>
                <div id="logOutput" class="text-gray-300 font-mono h-24 overflow-y-auto">System armed. Awaiting target
                    parameters...</div>
            </div>
        </section>

        <!-- Right Panel: Telemetry & Results Display -->
        <section class="lg:col-span-2 bg-controlPanel border border-gray-800 rounded-lg p-6 shadow-xl flex flex-col">
            <h2 class="text-lg font-semibold mb-4 text-blue-400 border-b border-gray-800 pb-2">Pipeline Output &
                Telemetry</h2>

            <div id="resultContainer"
                class="flex-1 bg-spaceBlack border border-gray-800 rounded p-6 flex flex-col items-center justify-center text-center text-gray-500">
                <svg class="w-12 h-12 mb-3 text-gray-700 animate-spin" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <p>No active data stream. Run a target scan to populate telemetry metrics.</p>
            </div>
        </section>
    </main>

    <!-- JavaScript Bridge Connection -->
    <script>
        // Live UTC Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('utc-clock').innerText = `UTC ${now.toISOString().substring(11, 19)}`;
        }, 1000);

        function logMessage(msg) {
            const log = document.getElementById('logOutput');
            log.innerHTML += `<div>> ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function runAnalysis() {
            const target = document.getElementById('targetInput').value.trim();
            const container = document.getElementById('resultContainer');

            if (!target) {
                logMessage("ERROR: Target field cannot be empty.");
                return;
            }

            logMessage(`Transmitting request for target: ${target}...`);
            container.innerHTML = `<p class="text-blue-400 animate-pulse">Running Box Least Squares pipeline for ${target}...</p>`;

            try {
                const response = await fetch(`http://127.0.0.1:8000/api/analyze/${encodeURIComponent(target)}`);
                const data = await response.json();

                if (response.ok) {
                    logMessage(`Success! Received telemetry for ${target}.`);
                    container.innerHTML = `
                        <div class="text-left w-full space-y-4">
                            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                                <span class="text-telemetryGreen font-bold">[STATUS: SUCCESS]</span>
                                <span class="text-gray-400 text-xs">Target: ${data.target}</span>
                            </div>
                            <pre class="bg-controlPanel p-4 rounded text-xs text-green-400 overflow-x-auto border border-gray-800">${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error(data.detail || "Unknown server error");
                }
            } catch (err) {
                logMessage(`CRITICAL ERROR: ${err.message}`);
                container.innerHTML = `<p class="text-nasaRed">Connection failed: Ensure FastAPI backend is running.</p>`;
            }
        }
    </script>
</body>

</html>
